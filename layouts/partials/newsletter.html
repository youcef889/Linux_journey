
{{ $subscribeURL := .Site.Params.subscribeURL }}

<form id="newsletter-form" class="mt-6">
  <div class="flex flex-col sm:flex-row gap-3">
    <input
      type="email"
      name="email"
      placeholder="Enter your email address"
      required
      class="w-full rounded-lg px-4 py-3"
    >

    <input
      type="text"
      name="website"
      tabindex="-1"
      autocomplete="off"
      aria-hidden="true"
      style="position:absolute;left:-9999px"
    >

    <button
      type="submit"
      class="rounded-lg px-6 py-3 font-semibold"
    >
      Subscribe
    </button>
  </div>

  <p id="newsletter-message" class="mt-3 text-sm"></p>
</form>

<script>
(() => {
  const form = document.getElementById("newsletter-form");
  if (!form) return;

  form.addEventListener("submit", async (event) => {
    event.preventDefault();

    const button = form.querySelector("button");
    const message = document.getElementById("newsletter-message");

    button.disabled = true;
    button.textContent = "Subscribing...";
    message.textContent = "";

    const data = new FormData(form);
    data.append("page", window.location.pathname);

    try {
      await fetch({{ $subscribeURL | jsonify }}, {
        method: "POST",
        body: data,
        mode: "no-cors"
      });

      message.textContent = "Thank you for subscribing!";
      form.reset();
    } catch (error) {
      message.textContent = "Unable to subscribe. Please try again.";
    } finally {
      button.disabled = false;
      button.textContent = "Subscribe";
    }
  });
})();
</script>
